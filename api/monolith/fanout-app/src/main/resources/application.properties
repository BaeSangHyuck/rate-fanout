spring.application.name=rate-fanout
server.port=${PORT:8080}
# 모의 금융사 API는 같은 앱 안에 있지만 실제 HTTP로 호출한다. 비우면 실행 중인 자기 포트를 쓴다
app.mock.base-url=${MOCK_BASE_URL:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
management.endpoints.web.exposure.include=health,prometheus

# 기본은 인메모리 H2라 아무것도 안 띄워도 돈다.
# 배포에서는 SPRING_DATASOURCE_URL/USERNAME/PASSWORD 환경변수로 Postgres(Neon)를 붙인다.
# LOCK_TIMEOUT은 비관적 락 대기가 길어져도 H2가 먼저 포기하지 않게 늘린다
spring.datasource.url=jdbc:h2:mem:app;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=60000
spring.datasource.hikari.maximum-pool-size=10
# 비관적 락 모드는 요청이 한 줄로 서서 커넥션 대기가 30초(기본값)를 넘기도 한다. 데모라 실패 대신 기다리게 한다
spring.datasource.hikari.connection-timeout=90000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# 중복 이벤트, 중복 발급은 PK·유니크 제약으로 거르는 게 정상 흐름이라 그때마다 찍히는 SQL 에러 로그는 끈다
logging.level.org.hibernate.orm.jdbc.error=off

# Redis: APP_REDIS_URL(예: redis://localhost:6379)이 있을 때만 쿠폰 REDIS 모드가 켜진다
# Kafka: APP_KAFKA_ENABLED=true, SPRING_KAFKA_BOOTSTRAP_SERVERS를 주면 아웃박스 릴레이가 카프카로 보낸다
spring.kafka.consumer.auto-offset-reset=earliest
